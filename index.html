<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>실력 점검 시험 시스템</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsdiff/5.1.0/diff.min.js"></script>
<style>
:root{--primary:#1e3a8a;--secondary:#fbbf24;--bg-color:#f3f4f6;--card-bg:#ffffff;--text-main:#333333;--success:#10b981;--error:#ef4444;--correct-blue:#2563eb}
body{font-family:'Malgun Gothic',sans-serif;background-color:var(--bg-color);margin:0;padding:20px 10px;display:flex;justify-content:center;min-height:100vh}
.container{background:var(--card-bg);width:100%;max-width:800px;padding:30px;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,.05);border-top:8px solid var(--primary);position:relative}
h2,h3{color:var(--primary);text-align:center}
h3{margin-top:0}
.btn{width:100%;padding:14px;background-color:var(--primary);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;transition:.2s;margin-top:10px}
.btn:hover{background-color:#1e40af}
.btn.btn-outline{background:0 0;color:var(--primary);border:2px solid var(--primary)}
.btn.btn-secondary{background:#6b7280}
.btn.btn-danger{background:var(--error)}
.btn-sm{width:auto;padding:6px 12px;font-size:12px;margin-top:0}
.input-group{margin-bottom:15px}
.input-group label{display:block;margin-bottom:5px;font-weight:700;color:var(--primary)}
.input-group input,.input-group select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box}
.question-box{background:#f8fafc;border:1px solid #e2e8f0;padding:20px;border-radius:10px;margin-bottom:20px}
.q-title{font-weight:700;color:var(--primary);margin-bottom:15px;border-bottom:2px solid var(--secondary);padding-bottom:5px}
textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;min-height:80px;resize:vertical;box-sizing:border-box;font-size:15px;line-height:1.6;margin-bottom:5px}
textarea:focus{border-color:var(--primary);outline:0;box-shadow:0 0 0 3px rgba(30,58,138,.1)}
.score-board{background:#fffbeb;padding:20px;border-radius:10px;text-align:center;border:2px solid var(--secondary);margin-bottom:20px}
.score-num{font-size:36px;font-weight:700;color:var(--primary)}
.acc-badge{padding:3px 8px;border-radius:4px;color:#fff;font-size:12px;font-weight:700;margin-left:10px;display:inline-block}
.acc-high{background:var(--success)}
.acc-low{background:var(--error)}
.tree-view{border:1px solid #ddd;padding:15px;border-radius:8px;max-height:300px;overflow-y:auto;background:#fff}
.hidden{display:none!important}
table{width:100%;border-collapse:collapse;margin-top:15px;font-size:13px}
td,th{border:1px solid #ddd;padding:10px;text-align:center;word-break:keep-all}
th{background:#f1f5f9;font-weight:700}
.admin-tools{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;background:#f9fafb;padding:10px;border-radius:8px;border:1px solid #eee}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);display:flex;justify-content:center;align-items:center;z-index:1000;padding:20px;box-sizing:border-box}
.modal-content{background:#fff;padding:25px;border-radius:12px;width:100%;max-width:700px;max-height:90vh;overflow-y:auto;position:relative}
.close-modal{position:absolute;top:15px;right:20px;font-size:24px;cursor:pointer;color:#888;border:none;background:0 0;font-weight:700}
.diff-correct{color:var(--correct-blue);font-weight:700}
.diff-error{color:var(--error);font-weight:700}
.result-content-box{padding:12px;border-radius:8px;margin-top:5px;line-height:1.6;font-size:15px;word-break:keep-all}
.verse-label{font-size:14px;font-weight:700;color:var(--primary);display:inline-block;margin-top:5px;margin-bottom:2px;}
.loading-msg{text-align:center;padding:20px;color:#666;font-size:14px;}

/* 탭 스타일 */
.tab-wrap{display:flex;gap:0;margin-bottom:20px;border-bottom:3px solid var(--primary);}
.tab-btn{flex:1;padding:12px;border:none;background:#e5e7eb;color:#555;font-size:15px;font-weight:700;cursor:pointer;border-radius:8px 8px 0 0;transition:.2s;}
.tab-btn.active{background:var(--primary);color:#fff;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* 새기록 강조 */
.badge-new{background:#7c3aed;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;margin-left:6px;vertical-align:middle;}
.badge-old{background:#6b7280;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;margin-left:6px;vertical-align:middle;}
</style>
</head>
<body>
<div class="container">

  <!-- 화면: 홈 -->
  <div id="screen-home">
    <h2 style="background:var(--secondary);padding:10px;border-radius:8px">사명자 실력 점검 시험</h2>
    <div id="msg-closed" class="hidden" style="color:var(--error);text-align:center;margin:10px;font-weight:700">※ 현재 본 시험 기간이 아닙니다.</div>
    <div class="input-group"><label>지역</label><input type="text" id="in-region" placeholder="예: 2지역"></div>
    <div class="input-group"><label>부서/과</label><input type="text" id="in-dept" placeholder="예: 청년회"></div>
    <div class="input-group"><label>직책</label><input type="text" id="in-role" placeholder="예: 구역장"></div>
    <div class="input-group"><label>성함</label><input type="text" id="in-name" placeholder="예: 홍길동"></div>
    <div style="display:flex;gap:10px">
      <div class="input-group" style="flex:1">
        <label>출제 방식</label>
        <select id="in-type">
          <option value="chunk">덩어리 전체 쓰기</option>
          <option value="verse" selected>한 절씩 나누어 쓰기 (기본)</option>
        </select>
      </div>
      <div class="input-group" style="flex:1">
        <label>문제 출제 순서</label>
        <select id="in-order">
          <option value="random">랜덤 섞기</option>
          <option value="sequential">말씀 순서대로</option>
        </select>
      </div>
    </div>
    <button class="btn" id="btn-exam" onclick="checkStart(false)">응시하기 (기록 저장됨)</button>
    <button class="btn btn-outline" onclick="openPracticeSetup()">연습모드 (기록 안됨)</button>
  </div>

  <!-- 화면: 연습모드 설정 -->
  <div id="screen-practice-setup" class="hidden">
    <h2>연습모드 설정</h2>
    <div class="input-group"><label>연습할 성구 선택</label><div class="tree-view" id="practice-list"></div></div>
    <div style="display:flex;gap:10px">
      <div class="input-group" style="flex:1">
        <label>출제 방식</label>
        <select id="practice-type">
          <option value="chunk">덩어리 전체 쓰기</option>
          <option value="verse" selected>한 절씩 나누어 쓰기</option>
        </select>
      </div>
      <div class="input-group" style="flex:1">
        <label>출제 순서</label>
        <select id="practice-order">
          <option value="random">랜덤 섞기</option>
          <option value="sequential">말씀 순서대로</option>
        </select>
      </div>
    </div>
    <button class="btn" onclick="checkStart(true)">연습 시작</button>
    <button class="btn btn-secondary" onclick="location.reload()">취소 및 돌아가기</button>
  </div>

  <!-- 화면: 시험 중 -->
  <div id="screen-exam" class="hidden">
    <h2 id="exam-title">시험 응시</h2>
    <div id="exam-info" style="text-align:right;font-size:13px;color:#666;margin-bottom:10px;font-weight:700"></div>
    <div id="question-container"></div>
    <button class="btn" onclick="submitExam()" style="background:var(--success);font-size:18px;margin-top:30px">답안 제출 및 채점하기</button>
  </div>

  <!-- 화면: 결과 -->
  <div id="screen-result" class="hidden">
    <h2>채점 결과</h2>
    <div class="score-board">
      <div id="res-user" style="color:#666;font-size:14px;margin-bottom:5px"></div>
      <div class="score-num" id="res-score">0점</div>
      <div id="res-acc" style="font-size:14px;margin-top:5px">평균 정확도: 0%</div>
    </div>
    <div id="result-details"></div>
    <div style="display:flex;gap:10px;margin-top:30px">
      <button class="btn" onclick="retakeExam()" style="margin-top:0">재시험 보기</button>
      <button class="btn btn-secondary" onclick="location.reload()" style="margin-top:0">처음으로</button>
    </div>
  </div>

  <!-- 화면: 관리자 로그인 -->
  <div id="screen-admin-auth" class="hidden" style="text-align:center;padding:40px 0">
    <h2>관리자 인증</h2>
    <p style="color:#666">보안을 위해 관리자 구글 계정으로 로그인해주세요.</p>
    <button class="btn" onclick="adminLogin()" style="width:auto;padding:12px 30px;background:#4285f4">구글 로그인</button>
    <button class="btn btn-secondary" onclick="location.reload()" style="width:auto">취소</button>
  </div>

  <!-- 화면: 관리자 패널 -->
  <div id="screen-admin" class="hidden">
    <h2>관리자 시스템</h2>

    <!-- 기본 설정 -->
    <div class="input-group" style="background:#f9fafb;padding:15px;border-radius:8px;border:1px solid #ddd">
      <label>본 시험 응시 활성화</label>
      <select id="set-isopen">
        <option value="true">열림 (응시 가능)</option>
        <option value="false">닫힘 (응시 불가)</option>
      </select>
    </div>
    <div class="input-group">
      <label>본 시험 출제 덩어리 선택</label>
      <div class="tree-view" id="admin-chunk-list"></div>
    </div>
    <button class="btn" onclick="saveAdminSettings()">기본 설정 저장</button>

    <hr style="margin:30px 0">
    <h3>응시자 데이터 관리</h3>

    <!-- 탭 -->
    <div class="tab-wrap">
      <button class="tab-btn active" onclick="switchTab('new')" id="tab-btn-new">
        새 응시 기록 <span class="badge-new">V6</span>
      </button>
      <button class="tab-btn" onclick="switchTab('old')" id="tab-btn-old">
        이전 응시 기록 <span class="badge-old">V5</span>
      </button>
    </div>

    <!-- 새 기록 탭 -->
    <div class="tab-panel active" id="tab-new">
      <div class="admin-tools">
        <div>
          <label style="font-size:13px;font-weight:700;margin-right:5px">정렬:</label>
          <select id="admin-sort-new" style="padding:5px;border-radius:4px;border:1px solid #ccc" onchange="renderTable('new')">
            <option value="dateDesc">최신순</option>
            <option value="scoreDesc">최고점수 순</option>
            <option value="nameAsc">이름순 (가나다)</option>
          </select>
        </div>
        <button class="btn btn-sm" style="background:#10b981;margin:0" onclick="downloadExcel('new')">엑셀 다운로드 (CSV)</button>
      </div>
      <div id="loading-new" class="loading-msg">데이터 불러오는 중...</div>
      <div style="overflow-x:auto">
        <table id="table-new" class="hidden">
          <thead><tr><th>소속/이름</th><th>최고점수</th><th>재시험여부</th><th>최근응시</th><th>관리</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- 이전 기록 탭 -->
    <div class="tab-panel" id="tab-old">
      <div class="admin-tools">
        <div>
          <label style="font-size:13px;font-weight:700;margin-right:5px">정렬:</label>
          <select id="admin-sort-old" style="padding:5px;border-radius:4px;border:1px solid #ccc" onchange="renderTable('old')">
            <option value="dateDesc">최신순</option>
            <option value="scoreDesc">최고점수 순</option>
            <option value="nameAsc">이름순 (가나다)</option>
          </select>
        </div>
        <button class="btn btn-sm" style="background:#6b7280;margin:0" onclick="downloadExcel('old')">엑셀 다운로드 (CSV)</button>
      </div>
      <div id="loading-old" class="loading-msg">데이터 불러오는 중...</div>
      <div style="overflow-x:auto">
        <table id="table-old" class="hidden">
          <thead><tr><th>소속/이름</th><th>최고점수</th><th>재시험여부</th><th>최근응시</th><th>관리</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <button class="btn btn-secondary" onclick="location.reload()" style="margin-top:20px">나가기</button>
  </div>
</div>

<!-- 상세 모달 -->
<div id="modal-detail" class="modal-overlay hidden">
  <div class="modal-content">
    <button class="close-modal" onclick="document.getElementById('modal-detail').classList.add('hidden')">&times;</button>
    <h3 id="modal-title">응시자 상세 답안</h3>
    <hr style="margin-bottom:15px;border:0;border-top:1px solid #eee">
    <div id="modal-body"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, collection, addDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD90YkT77h64XOfz2U96G9S7Csd0OhEVvk",
  authDomain: "cheongosi.firebaseapp.com",
  projectId: "cheongosi",
  storageBucket: "cheongosi.firebasestorage.app",
  messagingSenderId: "73793345931",
  appId: "1:73793345931:web:1944def28525c24bc2b78e"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

// ★ 새 기록은 V6, 이전 기록은 V5 (읽기 전용)
const COL_NEW = "examResultsV6";
const COL_OLD = "examResultsV5";

const bibleData = [
  {id:1,title:"계 1:1~3",verses:[{n:"1",t:"예수 그리스도의 계시라 이는 하나님이 그에게 주사 반드시 속히 될 일을 그 종들에게 보이시려고 그 천사를 그 종 요한에게 보내어 지시하신 것이라"},{n:"2",t:"요한은 하나님의 말씀과 예수 그리스도의 증거 곧 자기의 본 것을 다 증거하였느니라"},{n:"3",t:"이 예언의 말씀을 읽는 자와 듣는 자들과 그 가운데 기록한 것을 지키는 자들이 복이 있나니 때가 가까움이라"}]},
  {id:2,title:"계 3:12",verses:[{n:"12",t:"이기는 자는 내 하나님 성전에 기둥이 되게 하리니 그가 결코 다시 나가지 아니하리라 내가 하나님의 이름과 하나님의 성 곧 하늘에서 내 하나님께로부터 내려오는 새 예루살렘의 이름과 나의 새 이름을 그이 위에 기록하리라"}]},
  {id:3,title:"계 7:1~4",verses:[{n:"1",t:"이 일 후에 내가 네 천사가 땅 네 모퉁이에 선 것을 보니 땅의 사방의 바람을 붙잡아 바람으로 하여금 땅에나 바다에나 각종 나무에 불지 못하게 하더라"},{n:"2",t:"또 보매 다른 천사가 살아 계신 하나님의 인을 가지고 해 돋는 데로부터 올라와서 땅과 바다를 해롭게 할 권세를 얻은 네 천사를 향하여 큰 소리로 외쳐"},{n:"3",t:"가로되 우리가 우리 하나님의 종들의 이마에 인치기까지 땅이나 바다나 나무나 해하지 말라 하더라"},{n:"4",t:"내가 인 맞은 자의 수를 들으니 이스라엘 자손의 각 지파 중에서 인 맞은 자들이 십사만 사천이니"}]},
  {id:4,title:"계 10:10~11",verses:[{n:"10",t:"내가 천사의 손에서 작은 책을 갖다 먹어버리니 내 입에는 꿀같이 다나 먹은 후에 내 배에서는 쓰게 되더라"},{n:"11",t:"저가 내게 말하기를 네가 많은 백성과 나라와 방언과 임금에게 다시 예언하여야 하리라 하더라"}]},
  {id:5,title:"계 11:15",verses:[{n:"15",t:"일곱째 천사가 나팔을 불매 하늘에 큰 음성들이 나서 가로되 세상 나라가 우리 주와 그 그리스도의 나라가 되어 그가 세세토록 왕 노릇 하시리로다 하니"}]},

// ─── 채점 로직 ────────────────────────────────────────────────
function calculateScore(userAns, correctAns) {
  let u = userAns.replace(/[\s\.\,\?\!\'\"0-9\(\)\[\]\|\~\-\>\:\<\&]/g,'');
  let c = correctAns.replace(/[\s\.\,\?\!\'\"0-9\(\)\[\]\|\~\-\>\:\<\&]/g,'');
  return (u === c && u.length > 0) ? 100 : 0;
}

function renderDiff(userAns, correctAns) {
  if (!userAns) return '<span style="color:#999;">(미입력)</span>';
  if (typeof Diff === 'undefined') return userAns;
  const re = /[\s\.\,\?\!\'\"0-9\(\)\[\]\|\~\-\>\:\<\&]/g;
  let diffs = Diff.diffChars(correctAns.replace(re,''), userAns.replace(re,''));
  return diffs.map(p => {
    if (p.added)   return `<span style="color:var(--error);text-decoration:underline;">${p.value}</span>`;
    if (p.removed) return `<span style="background:#fca5a5;color:#7f1d1d;text-decoration:line-through;">${p.value}</span>`;
    return `<span style="color:var(--correct-blue);font-weight:700;">${p.value}</span>`;
  }).join('');
}

function toUnixSeconds(ts) {
  if (!ts) return 0;
  if (typeof ts === 'object' && ts.seconds !== undefined) return ts.seconds;
  if (typeof ts.toDate === 'function') return Math.floor(ts.toDate().getTime()/1000);
  if (ts instanceof Date) return Math.floor(ts.getTime()/1000);
  if (typeof ts === 'number') return ts > 1e10 ? Math.floor(ts/1000) : ts;
  const p = Date.parse(ts);
  return isNaN(p) ? 0 : Math.floor(p/1000);
}

function startExam() {
  let isChunk = isPracticeMode ? (document.getElementById("practice-type").value==='chunk') : (document.getElementById("in-type").value==='chunk');
  let order   = isPracticeMode ? document.getElementById("practice-order").value : document.getElementById("in-order").value;
  let ids     = isPracticeMode
    ? Array.from(document.querySelectorAll(".p-cb:checked")).map(c=>parseInt(c.value))
    : examSettings.selectedIds;

  if (isPracticeMode && ids.length===0) return alert("최소 하나 이상 선택해주세요.");

  let raw = bibleData.filter(b=>ids.includes(b.id)).map(b=>({id:b.id,title:b.title,verses:b.verses}));
  currentQuestions = order==='random' ? raw.sort(()=>Math.random()-.5) : raw;

  let html = '';
  currentQuestions.forEach((q,i) => {
    html += `<div class="question-box"><div class="q-title">Q${i+1}. ${q.title}</div>`;
    if (isChunk) {
      html += `<textarea class="ans chunk-ans" data-qi="${i}" placeholder="이곳에 말씀 전체를 통으로 작성하세요..."></textarea>`;
    } else {
      q.verses.forEach((v,vi) => {
        html += `<div><span class="verse-label">${v.n}절</span><textarea class="ans verse-ans" data-qi="${i}" data-vi="${vi}" placeholder="${v.n}절 말씀을 작성하세요..."></textarea></div>`;
      });
    }
    html += `</div>`;
  });

  document.getElementById("question-container").innerHTML = html;
  document.getElementById("exam-title").innerText = isPracticeMode ? "연습모드 응시 중" : "본 시험 응시 중";
  document.getElementById("exam-info").innerText = `${document.getElementById("in-region").value} ${document.getElementById("in-dept").value} ${document.getElementById("in-role").value} ${document.getElementById("in-name").value}`;
  showScreen("screen-exam");
}

// ─── 제출 & 채점 ──────────────────────────────────────────────
window.submitExam = async () => {
  if (!confirm("제출하시겠습니까?")) return;

  let isChunk = isPracticeMode ? (document.getElementById("practice-type").value==='chunk') : (document.getElementById("in-type").value==='chunk');
  let total=0, detailsHtml='', dbDetails=[];

  currentQuestions.forEach((q,i) => {
    if (isChunk) {
      let u = document.querySelector(`.chunk-ans[data-qi="${i}"]`).value.trim();
      let c = q.verses.map(v=>v.t).join(" ");
      let s = calculateScore(u,c);
      total += s;
      let bc = s===100?'acc-high':'acc-low';
      detailsHtml += `<div class="question-box" style="margin-bottom:15px;">
        <div class="q-title">${q.title} <span class="acc-badge ${bc}">정확도 ${s}%</span></div>
        <div style="font-size:14px;margin-bottom:12px;"><strong style="color:#555;">[나의 답안]</strong><br>
        <div class="result-content-box" style="background:#f9f9f9;border:1px solid #eee;">${renderDiff(u,c)}</div></div>
        <div style="font-size:14px;"><strong style="color:#10b981;">[정답]</strong><br>
        <div class="result-content-box" style="background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;">${c}</div></div>
      </div>`;
      dbDetails.push({title:q.title,user:u,correct:c,acc:s});

    } else {
      let vS=[], vH='', uArr=[], cArr=[];
      q.verses.forEach((v,vi) => {
        let u = document.querySelector(`.verse-ans[data-qi="${i}"][data-vi="${vi}"]`).value.trim();
        let s = calculateScore(u,v.t);
        vS.push(s);
        vH += `<div style="margin-top:8px;padding:10px;border-left:3px solid var(--secondary);background:#f8fafc;margin-bottom:8px;">
          <div style="font-weight:bold;font-size:13px;margin-bottom:4px;">${v.n}절 (${s===100?'정답':'오답'})</div>
          <div style="font-size:13px;margin-bottom:4px;"><strong style="color:#666;">[작성]</strong> ${renderDiff(u,v.t)}</div>
          <div style="font-size:13px;color:#065f46;"><strong style="color:#10b981;">[정답]</strong> ${v.t}</div>
        </div>`;
        uArr.push(`(${v.n}절) ${u}`);
        cArr.push(`(${v.n}절) ${v.t}`);
      });
      let qs = Math.round(vS.reduce((a,b)=>a+b,0)/vS.length);
      total += qs;
      let bc = qs===100?'acc-high':'acc-low';
      detailsHtml += `<div class="question-box" style="margin-bottom:15px;">
        <div class="q-title">${q.title} <span class="acc-badge ${bc}">정확도 ${qs}%</span></div>${vH}</div>`;
      dbDetails.push({title:q.title,user:uArr.join("  "),correct:cArr.join("  "),acc:qs});
    }
  });

  let avg = Math.round(total/currentQuestions.length);
  document.getElementById("res-score").innerText = `${avg}점`;
  document.getElementById("res-acc").innerText = `평균 정확도: ${avg}%`;
  document.getElementById("res-user").innerText = `${document.getElementById("in-region").value} ${document.getElementById("in-dept").value} ${document.getElementById("in-role").value} ${document.getElementById("in-name").value}`;
  document.getElementById("result-details").innerHTML = detailsHtml;

  if (!isPracticeMode) {
    try {
      // ★ 새 응시는 V6 컬렉션에 저장
      await addDoc(collection(db, COL_NEW), {
        region: document.getElementById("in-region").value,
        dept:   document.getElementById("in-dept").value,
        role:   document.getElementById("in-role").value,
        name:   document.getElementById("in-name").value,
        score: avg, avgAcc: avg,
        details: dbDetails,
        timestamp: new Date()
      });
    } catch(e) {
      console.error(e);
      alert("DB 저장 중 오류가 발생했습니다.");
    }
  }
  showScreen("screen-result");
};

// ─── 컬렉션 → 그룹 변환 공통 함수 ───────────────────────────
async function fetchGrouped(colName, loadingId, tableId) {
  document.getElementById(loadingId).innerText = "데이터 불러오는 중...";
  document.getElementById(loadingId).classList.remove("hidden");
  document.getElementById(tableId).classList.add("hidden");

  try {
    const snap = await getDocs(collection(db, colName));
    console.log(`[${colName}] ${snap.size}개 문서 로드됨`);

    if (snap.empty) {
      document.getElementById(loadingId).innerText = "응시 기록이 없습니다.";
      document.getElementById(tableId).classList.remove("hidden");
      document.getElementById(tableId).querySelector("tbody").innerHTML = `<tr><td colspan="5">응시 기록이 없습니다.</td></tr>`;
      return [];
    }

    let groups = {};
    snap.forEach(ds => {
      try {
        let d = { ...ds.data(), id: ds.id };
        d.region = d.region||''; d.dept = d.dept||''; d.role = d.role||''; d.name = d.name||'(이름없음)';
        d.score = typeof d.score==='number' ? d.score : 0;
        let key = `${d.region}_${d.dept}_${d.role}_${d.name}`;
        if (!groups[key]) groups[key] = { key, info:d, attempts:[] };
        groups[key].attempts.push(d);
      } catch(e) { console.warn("파싱 오류:", ds.id, e); }
    });

    let result = Object.values(groups).map(g => {
      g.maxScore   = Math.max(...g.attempts.map(a=>a.score));
      g.latestTime = Math.max(...g.attempts.map(a=>toUnixSeconds(a.timestamp)));
      return g;
    });

    document.getElementById(loadingId).classList.add("hidden");
    document.getElementById(tableId).classList.remove("hidden");
    return result;

  } catch(e) {
    console.error(`[${colName}] 로딩 실패:`, e);
    document.getElementById(loadingId).innerText = `로딩 실패: ${e.message}`;
    return [];
  }
}

  let html = '';
  list.forEach(g => {
    let date = g.latestTime>0 ? new Date(g.latestTime*1000).toLocaleString('ko-KR') : '날짜없음';

      ? `<span style="color:var(--error);font-weight:bold;">O (${g.attempts.length}회)</span>`
      : `<span style="color:#999;">X</span>`;
    html += `<tr>
      <td style="text-align:left;">
        <div style="font-size:11px;color:#888;">${g.info.region} / ${g.info.dept} / ${g.info.role}</div>
        <strong>${g.info.name}</strong>
      </td>
      <td><strong style="color:var(--primary);font-size:16px;">${g.maxScore}점</strong></td>
      <td>${retake}</td>
      <td style="font-size:12px;color:#666;">${date}</td>
      <td><button class="btn btn-sm btn-outline" onclick="showUserModal('${which}','${g.key}')">상세보기</button></td>
    </tr>`;
  });
  if (!html) html = `<tr><td colspan="5">응시 기록이 없습니다.</td></tr>`;
  document.getElementById(tableId).querySelector("tbody").innerHTML = html;
};

  let nav = '<div style="margin-bottom:15px;display:flex;gap:5px;flex-wrap:wrap;">';
  group.attempts.forEach((a,i) => {

window.renderAttemptDetail = (which, key, idx) => {
  let group = (which==='new' ? groupedNew : groupedOld).find(g=>g.key===key);
  let att = group.attempts[idx];

  let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;background:#f1f5f9;padding:10px;border-radius:8px;">
    <strong style="font-size:16px;">${idx+1}회차 답안 (점수: ${att.score}점)</strong>
    <button class="btn btn-sm btn-danger" style="margin:0;" onclick="deleteAttempt('${which}','${key}','${att.id}')">이 회차 삭제</button>
  </div>`;

  if (!att.details||att.details.length===0) {
    html += '<p>상세 데이터가 없습니다.</p>';
  } else {
    att.details.forEach(d => {
      let bc = d.acc===100?'var(--success)':'var(--error)';
      html += `<div style="margin-bottom:15px;border:1px solid #ddd;padding:15px;border-radius:8px;">
        <strong style="color:var(--primary);">${d.title}</strong>
        <span style="color:#fff;background:${bc};padding:2px 6px;border-radius:4px;font-size:12px;font-weight:bold;margin-left:5px;">${d.acc}%</span>
        <div style="margin-top:12px;font-size:13px;">
          <strong style="color:#666;">[제출 답안]</strong>
          <div class="result-content-box" style="background:#f9f9f9;border:1px solid #eee;">${renderDiff(d.user,d.correct)}</div>
        </div>
        <div style="margin-top:10px;font-size:13px;">
          <strong style="color:#10b981;">[정답]</strong>
          <div class="result-content-box" style="background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;">${d.correct}</div>
        </div>
      </div>`;
    });
  }
  document.getElementById("attempt-detail-container").innerHTML = html;
};

window.deleteAttempt = async (which, key, docId) => {
  if (!confirm("해당 회차의 기록을 정말 삭제하시겠습니까?")) return;
  let col = which==='new' ? COL_NEW : COL_OLD;
  try {
    await deleteDoc(doc(db, col, docId));
    alert("삭제되었습니다.");
    document.getElementById("modal-detail").classList.add("hidden");
    loadAdminData();
  } catch(e) { alert("삭제 실패"); console.error(e); }
};

// ─── CSV 다운로드 ──────────────────────────────────────────────
window.downloadExcel = (which) => {
  let list = which==='new' ? groupedNew : groupedOld;
  if (!list.length) return alert("다운로드할 데이터가 없습니다.");
  let csv = "\uFEFF지역,부서,직책,이름,최고점수,총응시횟수,최근응시일시\n";
  list.forEach(g => {
    let date = g.latestTime>0 ? new Date(g.latestTime*1000).toLocaleString('ko-KR') : '';
    let row = [g.info.region,g.info.dept,g.info.role,g.info.name,g.maxScore,g.attempts.length,date]
      .map(v=>`"${String(v).replace(/"/g,'""')}"`);
    csv += row.join(",")+"\n";
  });
  let label = which==='new' ? 'V6새기록' : 'V5이전기록';
  let blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `사명자_실력점검_${label}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
};

// ─── 설정 저장 ────────────────────────────────────────────────
window.saveAdminSettings = async () => {
  try {
    let isOpen = document.getElementById("set-isopen").value==="true";
    let ids = Array.from(document.querySelectorAll(".a-cb:checked")).map(c=>parseInt(c.value));
    if (!ids.length) return alert("최소 하나 이상의 성구를 선택해주세요.");
    await setDoc(doc(db,"settings","examV5"),{isOpen,selectedIds:ids});
    alert("설정이 저장되었습니다.");
    location.reload();
  } catch(e) { alert("저장 실패"); console.error(e); }
};
</script>

</html>
